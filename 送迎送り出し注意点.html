                    <i class="fa-solid fa-file-csv text-emerald-600"></i> <span class="hidden sm:inline">CSV</span>
                </button>
                <button onclick="window.print()" title="印刷" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center gap-1">
                    <i class="fa-solid fa-print text-slate-600"></i> <span class="hidden sm:inline">印刷</span>
                </button>
                <button onclick="confirmResetData()" title="初期データに戻す" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg text-xs transition">
                    <i class="fa-solid fa-rotate-left"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 sm:px-6 pt-4 flex-grow w-full">

        <!-- Search & Filter Area -->
        <div class="bg-white rounded-xl p-3.5 sm:p-4 shadow-sm border border-slate-200/80 mb-4 space-y-3 no-print">
            <!-- Search bar -->
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="No.、氏名、対応方法、備考から検索..." 
                       class="w-full pl-10 pr-10 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition text-sm text-slate-800 placeholder-slate-400">
                <button id="clear-search" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <!-- Filter Controls -->
            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-xs">
                <div class="flex flex-wrap items-center gap-2">
                    <span class="text-slate-500 font-medium">受け入れ:</span>
                    <select id="filter-family" onchange="render()" class="bg-slate-50 border border-slate-200 rounded-md px-2 py-1 focus:ring-1 focus:ring-brand-500">
                        <option value="all">すべて</option>
                        <option value="あり">あり</option>
                        <option value="なし">なし</option>
                        <option value="日によって">日によって</option>
                    </select>

                    <button id="btn-filter-remarks" onclick="toggleRemarksFilter()" class="px-2.5 py-1 rounded-md border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 flex items-center gap-1 transition">
                        <i class="fa-solid fa-triangle-exclamation text-amber-500"></i> 備考ありのみ
                    </button>

                    <button id="btn-filter-fav" onclick="toggleFavFilter()" class="px-2.5 py-1 rounded-md border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 flex items-center gap-1 transition">
                        <i class="fa-solid fa-star text-slate-400" id="fav-icon"></i> お気に入り
                    </button>
                </div>

                <div class="text-slate-500 font-medium ml-auto">
                    表示: <span id="filtered-count" class="font-bold text-brand-700">0</span> / <span id="total-count">0</span> 件
                </div>
            </div>
        </div>

        <div id="list-container" class="space-y-3">
            <!-- Dynamically populated vertical cards -->
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="hidden py-16 text-center">

    </main>

                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <form id="edit-form" onsubmit="saveRecord(event)" class="p-5 space-y-4 text-sm">
                <input type="hidden" id="edit-id">

                <div class="grid grid-cols-3 gap-3">
                    <div class="col-span-1">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">No. (番号)</label>
                        <input type="number" id="edit-no" required min="1" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500 focus:bg-white text-slate-800">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-semibold text-slate-600 mb-1">氏名 <span class="text-rose-500">*</span></label>
                        <input type="text" id="edit-name" required placeholder="例: 山田 太郎 様" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500 focus:bg-white text-slate-800">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ご家族受け入れ <span class="text-rose-500">*</span></label>

                        <option value="あり">あり</option>
                        <option value="なし">なし</option>
                        <option value="日によって">日によって</option>
                    </select>
                </div>

                <div>

                    <input type="text" id="edit-method" required placeholder="例: 玄関まで / ご家族へ受け渡すまで" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500 focus:bg-white text-slate-800">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">備考・注意事項</label>
                    <textarea id="edit-remarks" rows="3" placeholder="特記事項（鍵所持、車いす移動、注意点等）" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500 focus:bg-white text-slate-800"></textarea>
                </div>

                    <div class="flex gap-2">

                            キャンセル
                        </button>
                        <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white font-medium rounded-lg text-xs transition shadow-sm">
                            保存する
                        </button>
                    </div>
                </div>
            </form>

            { no: 100, name: "宮島 利平 様", family: "あり", method: "玄関まで", remarks: "-" },
            { no: 101, name: "村田 好子 様", family: "なし", method: "自室まで", remarks: "中に入りベッドへ移乗するまで 鍵を閉めたらポストへ" },
            { no: 102, name: "森本 敏子 様", family: "あり", method: "ご家族へ受け渡すまで", remarks: "-" },
            { no: 103, name: "門奈 和子 様", family: "なし", method: "玄関まで", remarks: "-" },
            { no: 104, name: "柳町 和夫 様", family: "なし", method: "玄関まで", remarks: "-" },
            { no: 105, name: "柳町 文子 様", family: "あり", method: "ご家族へ受け渡すまで", remarks: "-" },
            { no: 106, name: "谷中 周子 様", family: "なし", method: "玄関まで", remarks: "-" },
            { no: 107, name: "谷中 とく 様", family: "なし", method: "玄関まで", remarks: "-" },
            { no: 108, name: "山口 英男 様", family: "あり", method: "玄関まで", remarks: "-" },
            { no: 109, name: "山田 愛子 様", family: "なし", method: "玄関まで", remarks: "-" },
            { no: 110, name: "山路 麗子 様", family: "なし", method: "玄関まで", remarks: "-" },
            { no: 111, name: "横山 勝夫 様", family: "あり", method: "ご家族へ受け渡すまで", remarks: "妹のお店に送り届けてください" },
            { no: 112, name: "吉江 昭一 様", family: "あり", method: "ご家族へ受け渡すまで", remarks: "-" },
            { no: 113, name: "吉原 文男 様", family: "あり", method: "ご家族へ受け渡すまで", remarks: "-" },
            { no: 114, name: "和久井 明 様", family: "あり", method: "ご家族へ受け渡すまで", remarks: "-" },
            { no: 115, name: "渡辺 洋子 様", family: "なし", method: "玄関まで", remarks: "-" }
        ];

        // State Variables
        let records = [];
        let favorites = new Set();
        let completed = new Set();
        let favFilterActive = false;
        let remarksFilterActive = false;
        let activeEditNo = null;

        window.onload = function() {
            loadState();
            render();
        };

        function loadState() {
            const stored = localStorage.getItem('care_okuridashi_records_v2');
            records = stored ? JSON.parse(stored) : JSON.parse(JSON.stringify(defaultData));

            const storedFavs = localStorage.getItem('care_okuridashi_favs_v2');
            favorites = storedFavs ? new Set(JSON.parse(storedFavs)) : new Set();

            const storedComp = localStorage.getItem('care_okuridashi_comp_v2');
            completed = storedComp ? new Set(JSON.parse(storedComp)) : new Set();
        }

        function saveState() {
            localStorage.setItem('care_okuridashi_records_v2', JSON.stringify(records));
            localStorage.setItem('care_okuridashi_favs_v2', JSON.stringify(Array.from(favorites)));
            localStorage.setItem('care_okuridashi_comp_v2', JSON.stringify(Array.from(completed)));
        }

        function confirmResetData() {
            if (confirm("全てのデータを初期の全115件の状態に戻しますか？")) {
                records = JSON.parse(JSON.stringify(defaultData));
                favorites.clear();
                completed.clear();
                saveState();
                render();
                showToast("全115件の初期データに復元しました");
            }
        }

        function getFilteredRecords() {
            const search = document.getElementById('search-input').value.trim().toLowerCase();
            const familyFilter = document.getElementById('filter-family').value;

            return records.filter(item => {
                // Search term check
                const matchSearch = !search || 
                    String(item.no).includes(search) ||
                    item.name.toLowerCase().includes(search) || 
                    item.method.toLowerCase().includes(search) || 
                    item.remarks.toLowerCase().includes(search);

                // Family Filter
                const matchFamily = familyFilter === 'all' || item.family === familyFilter;

                // Fav Filter
                const matchFav = !favFilterActive || favorites.has(item.no);

                // Remarks filter
                const matchRemarks = !remarksFilterActive || (item.remarks && item.remarks !== '-');

                return matchSearch && matchFamily && matchFav && matchRemarks;
            }).sort((a, b) => a.no - b.no); // Maintain No. order
        }

        function highlightText(text, searchStr) {
            if (!searchStr || text === '-') return text;
            const re = new RegExp(`(${searchStr.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
            return text.replace(re, '<mark class="highlight">$1</mark>');
        }

        function render() {
            const filtered = getFilteredRecords();
            const searchStr = document.getElementById('search-input').value.trim();

            document.getElementById('filtered-count').innerText = filtered.length;
            document.getElementById('total-count').innerText = records.length;

            const container = document.getElementById('list-container');
            const emptyState = document.getElementById('empty-state');

            if (filtered.length === 0) {
                container.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            container.innerHTML = filtered.map(item => {
                const isFav = favorites.has(item.no);
                const isDone = completed.has(item.no);
                const hasNote = item.remarks && item.remarks !== '-';

                return `
                    <div class="list-card bg-white rounded-xl p-3.5 sm:p-4 shadow-sm border ${isDone ? 'border-slate-200 bg-slate-50/70 opacity-75' : 'border-slate-200/90'} hover:border-brand-300 transition relative group">
                        
                        <!-- Top Bar: No Badge, Name, Status Actions -->
                        <div class="flex items-center justify-between gap-2 mb-2.5">
                            <div class="flex items-center gap-2.5">
                                <!-- No. Badge -->
                                <span class="bg-brand-700 text-white font-bold text-xs px-2.5 py-1 rounded-md shadow-xs whitespace-nowrap">
                                    No. ${highlightText(String(item.no), searchStr)}
                                </span>
                                
                                <!-- Name -->
                                <h2 class="font-bold text-slate-800 text-base sm:text-lg ${isDone ? 'line-through text-slate-400' : ''}">
                                    ${highlightText(item.name, searchStr)}
                                </h2>
                            </div>

                            <!-- Actions (Fav, Done Check, Edit) -->
                            <div class="flex items-center gap-1 sm:gap-2 no-print">
                                <button onclick="toggleDone(${item.no})" title="${isDone ? '未完了に戻す' : '完了チェック'}" 
                                        class="p-1.5 rounded-lg border ${isDone ? 'bg-emerald-50 text-emerald-600 border-emerald-200' : 'text-slate-300 border-slate-200 hover:text-slate-500'} transition text-sm">
                                    <i class="fa-solid fa-circle-check"></i>
                                </button>
                                <button onclick="toggleFavorite(${item.no})" title="お気に入り" 
                                        class="p-1.5 rounded-lg border ${isFav ? 'bg-amber-50 text-amber-500 border-amber-200' : 'text-slate-300 border-slate-200 hover:text-amber-400'} transition text-sm">
                                    <i class="fa-solid fa-star"></i>
                                </button>
                                <button onclick="openEditModal(${item.no})" title="編集" class="p-1.5 text-slate-400 hover:text-brand-600 border border-slate-200 rounded-lg transition text-sm">
                                    <i class="fa-solid fa-pen"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Content Grid: Family Acceptance & Method -->
                        <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 text-xs sm:text-sm mb-2.5">
                            <div class="sm:col-span-4 flex items-center gap-1.5">
                                <span class="text-slate-400 text-xs font-medium whitespace-nowrap">受入:</span>
                                ${getFamilyBadgeHtml(item.family)}
                            </div>
                            <div class="sm:col-span-8 flex items-center gap-1.5">
                                <span class="text-slate-400 text-xs font-medium whitespace-nowrap">方法:</span>
                                <span class="font-medium text-slate-800 bg-slate-100 px-2.5 py-1 rounded-md border border-slate-200/60 w-full sm:w-auto">
                                    <i class="fa-solid fa-person-walking-arrow-right text-slate-400 mr-1 text-xs"></i>
                                    ${highlightText(item.method, searchStr)}
                                </span>
                            </div>
                        </div>

                        <!-- Remarks Section -->
                        <div class="text-xs p-2.5 rounded-lg border ${hasNote ? 'bg-amber-50/90 border-amber-200 text-amber-950 font-medium' : 'bg-slate-50/80 border-slate-100 text-slate-400'}">
                            <div class="flex items-start gap-1.5">
                                <i class="fa-solid ${hasNote ? 'fa-triangle-exclamation text-amber-500' : 'fa-comment text-slate-300'} text-xs mt-0.5"></i>
                                <span class="leading-relaxed">
                                    ${hasNote ? highlightText(item.remarks, searchStr) : '備考なし'}
                                </span>
                            </div>
                        </div>

                    </div>
                `;
            }).join('');
        }

        function getFamilyBadgeHtml(status) {
            if (status === 'あり') {
                return `<span class="inline-flex items-center gap-1 text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-0.5 rounded-md font-semibold"><i class="fa-solid fa-circle-check text-[10px]"></i> あり</span>`;
            } else if (status === 'なし') {
                return `<span class="inline-flex items-center gap-1 text-xs bg-slate-100 text-slate-600 border border-slate-200 px-2 py-0.5 rounded-md font-medium"><i class="fa-solid fa-circle-minus text-[10px] text-slate-400"></i> なし</span>`;
            } else {
                return `<span class="inline-flex items-center gap-1 text-xs bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-md font-medium"><i class="fa-solid fa-clock text-[10px]"></i> 日による</span>`;
            }
        }

        function handleSearch() {
            const input = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');
            if (input.value) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            render();
        }

        function clearSearch() {
            document.getElementById('search-input').value = '';
            document.getElementById('clear-search').classList.add('hidden');
            render();
        }

        function toggleFavorite(no) {
            if (favorites.has(no)) {
                favorites.delete(no);
            } else {
                favorites.add(no);
            }
            saveState();
            render();
        }

        function toggleDone(no) {
            if (completed.has(no)) {
                completed.delete(no);
            } else {
                completed.add(no);
            }
            saveState();
            render();
        }

        function toggleFavFilter() {
            favFilterActive = !favFilterActive;
            const btn = document.getElementById('btn-filter-fav');
            const icon = document.getElementById('fav-icon');

            if (favFilterActive) {
                btn.className = "px-2.5 py-1 rounded-md border border-rose-200 bg-rose-50 text-rose-700 flex items-center gap-1 transition font-semibold";
                icon.className = "fa-solid fa-star text-rose-500";
            } else {
                btn.className = "px-2.5 py-1 rounded-md border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 flex items-center gap-1 transition";
                icon.className = "fa-solid fa-star text-slate-400";
            }
            render();
        }

        function toggleRemarksFilter() {
            remarksFilterActive = !remarksFilterActive;
            const btn = document.getElementById('btn-filter-remarks');

            if (remarksFilterActive) {
                btn.className = "px-2.5 py-1 rounded-md border border-amber-300 bg-amber-100 text-amber-800 flex items-center gap-1 transition font-bold";
            } else {
                btn.className = "px-2.5 py-1 rounded-md border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 flex items-center gap-1 transition";
            }
            render();
        }

        function openEditModal(no = null) {
            activeEditNo = no;
            const modal = document.getElementById('edit-modal');
            const title = document.getElementById('edit-modal-title');
            const deleteBtn = document.getElementById('btn-delete-record');

            if (no !== null) {
                const item = records.find(r => r.no === no);
                if (!item) return;
                title.innerText = `データ編集 (No.${no})`;
                deleteBtn.classList.remove('hidden');
                document.getElementById('edit-id').value = item.no;
                document.getElementById('edit-no').value = item.no;
                document.getElementById('edit-name').value = item.name;
                document.getElementById('edit-family').value = item.family;
                document.getElementById('edit-method').value = item.method;
                document.getElementById('edit-remarks').value = item.remarks === '-' ? '' : item.remarks;
            } else {
                title.innerText = "新規データ追加";
                deleteBtn.classList.add('hidden');
                document.getElementById('edit-id').value = '';
                document.getElementById('edit-form').reset();
                // Suggest next No.
                const maxNo = records.length > 0 ? Math.max(...records.map(r => r.no)) : 0;
                document.getElementById('edit-no').value = maxNo + 1;
            }

            modal.classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('edit-modal').classList.add('hidden');
        }

        function saveRecord(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const targetNo = parseInt(document.getElementById('edit-no').value, 10);
            const name = document.getElementById('edit-name').value.trim();
            const family = document.getElementById('edit-family').value;
            const method = document.getElementById('edit-method').value.trim();
            let remarks = document.getElementById('edit-remarks').value.trim();
            if (!remarks) remarks = '-';

            if (editId !== '') {
                // Edit
                const oldNo = parseInt(editId, 10);
                const idx = records.findIndex(r => r.no === oldNo);
                if (idx !== -1) {
                    records[idx] = { no: targetNo, name, family, method, remarks };
                    showToast(`No.${targetNo} のデータを更新しました`);
                }
            } else {
                // New
                records.push({ no: targetNo, name, family, method, remarks });
                showToast(`No.${targetNo} を新規追加しました`);
            }

            saveState();
            closeEditModal();
            render();
        }

        function deleteCurrentRecord() {
            if (activeEditNo === null) return;
            if (confirm(`No.${activeEditNo} のデータを削除しますか？`)) {
                records = records.filter(r => r.no !== activeEditNo);
                favorites.delete(activeEditNo);
                completed.delete(activeEditNo);
                saveState();
                closeEditModal();
                render();
                showToast("データを削除しました");
            }
        }

        function exportToCSV() {
            const filtered = getFilteredRecords();
            if (filtered.length === 0) {
                showToast("出力対象のデータがありません");
                return;
            }

            let csvContent = "\uFEFFNo,氏名,ご家族受け入れ,対応方法,備考・注意事項\n";
            filtered.forEach(r => {
                const cleanName = `"${r.name.replace(/"/g, '""')}"`;
                const cleanFamily = `"${r.family.replace(/"/g, '""')}"`;
                const cleanMethod = `"${r.method.replace(/"/g, '""')}"`;
                const cleanRemarks = `"${r.remarks.replace(/"/g, '""')}"`;
                csvContent += `${r.no},${cleanName},${cleanFamily},${cleanMethod},${cleanRemarks}\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', `送り出し注意点_No1-115_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("CSVを出力しました");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.innerText = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
